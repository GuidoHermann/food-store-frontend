<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <title>Registro - Food Store</title>

<body>
  <h1>Crear Cuenta</h1>
  <form id="registroForm">
    <div>
      <label>Email:</label>
      <input type="email" id="email" required />

    <div>
      <label>Contraseña:</label>
      <input type="password" id="password" required />
    </div>
    <button type="submit">Registrarse</button>
  </form>
  <p><a href="/src/pages/auth/login/login.html">¿Ya tenés cuenta? Iniciar Sesión</a></p>
  <script type="module" src="./registro.ts"></script>

</html>

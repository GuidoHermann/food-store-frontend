<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="/src/styles.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Store - Catálogo</title>
</head>
<body>
 <header>
  <h1>Food Store - Catálogo</h1>
  <nav>
    <a href="/src/pages/client/home/home.html">Inicio</a> | 
    <a href="/src/pages/client/cart/cart.html">Ver Carrito</a> | 
    <a href="/src/pages/auth/login/login.html">Cerrar Sesión / Login</a>
  </nav>
</header>

  <main>
    <!-- Seccion de búsqueda por nombre (HU-P1-01) -->
    <section>
      <input 
        type="text" 
        id="input-search" 
        placeholder="Buscar productos por nombre..." 
      />
    </section>

    <div style="display: flex; gap: 20px; margin-top: 20px;">
      <!-- Menu lateral de categorías (HU-P1-02) -->
      <aside>
        <h3>Categorías</h3>
        <div id="categories-container">
          <!-- Las categorías se cargan dinámicamente con JS -->
        </div>
      </aside>

      <!-- Grilla de productos (HU-P1-01 / HU-P1-03) -->
      <section>
        <h2>Productos</h2>
        <div id="products-container">
          <!-- Las tarjetas de productos se renderizan dinámicamente -->
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./home.ts"></script>
</body>
</html>
